name: CI

on:
  push:
  pull_request:

jobs:
  pipeline-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src dashboard tests scripts
      - name: Build pipeline from the internet sources
        run: uv run retail-bi all
      - name: Unit + data tests
        run: uv run pytest -m "not e2e"
      - name: Browser tests
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest -m e2e
      - uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: docs/data_quality_report.html
