# Keyword rules that derive a product category from its description.
# The source data has no category column, so this is the business logic that
# adds one. Rules run top to bottom and the FIRST match wins, so specific
# multi-word phrases come before broad single words.
# Patterns are regular expressions matched against the UPPER-CASED description.

rules:
  # --- seasonal first: a "CHRISTMAS CANDLE" is a Christmas product ----------
  - [Seasonal, Christmas, '\b(CHRISTMAS|XMAS|ADVENT|SANTA|REINDEER|SNOWFLAKE|SNOWMAN|NOEL|NATIVITY|WREATH|BAUBLE|TREE TOP|ELF)\b']
  - [Seasonal, Easter, '\b(EASTER|EGGS|EGG HUNT|HANGING EGG|DECORATIVE EGG|CHICKS?|BUNNY|BUNNIES)\b']
  - [Seasonal, Halloween, '\b(HALLOWEEN|PUMPKIN|WITCH|SPOOKY)\b']

  # --- specific phrases -------------------------------------------------------
  - [Kitchen & Dining, Baking, '\b(CAKE CASES|BAKING|CUTTERS?|MOULDS?|CUPCAKE|ICING|RECIPE|JELLY|PUDDING|PASTRY|ROLLING PIN|CAKE TINS?|MINI CASES|JAM MAKING)\b']
  - [Kitchen & Dining, Kitchen Textiles, '\b(TEA TOWELS?|OVEN GLOVES?|APRON|POT HOLDER|TEA COSY)\b']
  - [Kitchen & Dining, Lunch & Picnic, '\b(LUNCH ?BOX|LUNCH BAG|LUNCHBOX|PICNIC|FLASK|BOTTLE COVER|WATER BOTTLE|DRINKS)\b']
